#################################
# Picom config — picom v13
#################################
backend = "glx";
vsync = true;
use-damage = true;

#################################
# ANIMATIONS (native picom v13 script system)
# NOTE: the old "animation-window-rule"/"animation-stiffness" options were
# from a third-party fork and are silently ignored by stock picom v13.
#################################
# Hyprland-inspired animations (global defaults)
animations = ({
    # Window opens: fly in from the bottom + fade (Hyprland default feel)
    triggers = [ "open" ];
    preset = "fly-in";
    direction = "up";
    duration = 0.30;
}, {
    # Window closes: fly out toward the bottom
    triggers = [ "close" ];
    preset = "fly-out";
    direction = "down";
    duration = 0.30;
}, {
    # Unminimize: scale + fade back in
    triggers = [ "show" ];
    preset = "appear";
    scale = 0.85;
    duration = 0.20;
}, {
    # Minimize: scale + fade away (Hyprland minimize feel)
    triggers = [ "hide" ];
    preset = "disappear";
    scale = 0.10;
    duration = 0.25;
}, {
    # Window moved/resized (incl. i3 layout shifts): smooth transition
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.25;
}, {
    # Opacity / shadow-color changes: smooth transition between states
    triggers = [ "color" ];
    preset = "geometry-change";
    duration = 0.20;
});

#################################
# FADING
#################################
fading = true;
fade-delta = 10;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [
    "class_g = 'rofi'",
    "class_g = 'Dunst'"
];

#################################
# TRANSPARENCY
#################################
active-opacity = 0.90;
inactive-opacity = 0.75;
frame-opacity = 0.85;
opacity-rule = [
    "100:class_g = 'i3bar'",
    "100:class_g = 'polybar'",
    "100:class_g = 'Dunst'",
    "100:class_g = 'rofi'",
    "88:class_g = 'Alacritty' && focused",
    "60:class_g = 'Alacritty' && !focused",
    "90:class_g = 'firefox' && focused",
    "70:class_g = 'firefox' && !focused",
    "90:class_g = 'Code' && focused",
    "65:class_g = 'Code' && !focused"
];

#################################
# SHADOWS
#################################
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.50;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#000000";
shadow-exclude = [
    "class_g = 'Dunst'",
    "class_g = 'rofi'",
    "class_g = 'i3bar'",
    "class_g = 'polybar'",
    "window_type = 'tooltip'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#################################
# ROUNDED CORNERS
#################################
corner-radius = 12;
rounded-corners-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'polybar'",
    "class_g = 'Dunst'",
    "class_g = 'rofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#################################
# BLUR
#################################
blur-background = true;
blur-background-fixed = true;
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'polybar'",
    "class_g = 'Dunst'",
    "class_g = 'rofi'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'mpv'",
    "class_g = 'VLC'"
];

#################################
# DIM
#################################
inactive-dim = 0.15;

#################################
# WINDOW TYPES
#################################
wintypes:
{
    normal = { fade = true; shadow = true; };
    dialog = { fade = true; shadow = true; opacity = 0.90; };
    menu = { fade = true; shadow = false; };
    dropdown_menu = { fade = true; shadow = false; };
    popup_menu = { fade = true; shadow = false; };
    tooltip = { fade = true; shadow = false; };
    notification = { fade = true; shadow = true; };
    dock = { shadow = false; };
    desktop = { };
};

#################################
# PERFORMANCE
#################################
# unredir-if-possible is OFF on purpose: when a single window fills the
# screen (common in tiling WMs like i3), this setting hands rendering
# directly to the X server and bypasses the compositor entirely — which
# kills shadows, blur, AND animations for that window. This is the most
# common reason animations "don't work" despite a valid config.
unredir-if-possible = false;

detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
log-level = "warn";
