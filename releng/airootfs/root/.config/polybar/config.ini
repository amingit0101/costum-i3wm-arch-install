; ============================================================
; Polybar config — migrated from i3bar + i3blocks
; Matches the same Nord palette, module order, and scripts you
; were already using in ~/.config/i3/scripts/
;
; KEY DIFFERENCE FROM i3bar: polybar draws each element (bg,
; text, icons) as separate compositing layers, so background=
; can carry a real alpha channel (last 2 hex digits) while text
; stays fully opaque — the thing i3bar + picom could not do.
; ============================================================

[colors]
nord0  = #2E3440
nord1  = #3B4252
nord3  = #4C566A
nord4  = #D8DEE9
nord6  = #ECEFF4
nord7  = #8FBCBB
nord8  = #88C0D0
nord9  = #81A1C1
nord10 = #5E81AC
nord11 = #BF616A
nord13 = #EBCB8B
nord14 = #A3BE8C

; Background alpha: this AA suffix is the actual transparency —
; last two hex digits are the alpha channel (00 = invisible,
; ff = fully opaque). CC ≈ 80% opaque, similar to what you had
; via picom's opacity-rule before, but now ONLY the background
; carries it — text/icons below stay fully readable.
bg = #22181B21
fg = ${colors.nord6}

[bar/main]
width = 100%
height = 42
offset-x = 0
offset-y = 0
radius = 10
fixed-center = false

background = ${colors.bg}
foreground = ${colors.fg}

line-size = 2
line-color = ${colors.nord8}

border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

font-0 = "Noto Sans:size=14;2"
font-1 = "Font Awesome 7 Free:style=Solid:size=14;2"
font-2 = "Noto Color Emoji:scale=12;2"

modules-left = powermenu sep launcher-term launcher-web launcher-files launcher-emoji sep i3workspaces
modules-center =
modules-right = disk memory cpu temperature sep network bandwidth sep pulseaudio sep powerprofile battery sep xkeyboard date

tray-position = right
tray-padding = 2

cursor-click = pointer

; ============================================================
; SEPARATOR
; ============================================================
[module/sep]
type = custom/text
content = "│"
content-foreground = ${colors.nord3}

; ============================================================
; WORKSPACES (native i3 module — this replaces the automatic
; workspace strip i3bar used to draw for you; polybar needs it
; declared explicitly)
; ============================================================
[module/i3workspaces]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = true

label-focused = %name%
label-focused-background = ${colors.nord10}
label-focused-foreground = ${colors.nord0}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.nord4}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.nord9}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.nord11}
label-urgent-foreground = ${colors.nord6}
label-urgent-padding = 2

; ============================================================
; QUICK LAUNCH ICONS
; NOTE: glyphs left blank same as your old i3blocks file — paste
; your Nerd Font icons back in after "content =" on each.
; ============================================================
[module/powermenu]
type = custom/text
content = "  ⏻  "
content-foreground = ${colors.nord11}
content-background = #3B1E22
click-left = $HOME/.config/i3/scripts/powermenu

[module/launcher-term]
type = custom/text
content = ""
content-foreground = #807dfe
; FIX: was "i3-msg -q exec xfce4-terminal". Nothing else in your
; setup uses xfce4-terminal — every terminal binding in your i3
; config (mod+Return, mod+n ranger, mod+m htop) launches alacritty,
; and xfce4-terminal was never installed alongside it. Clicking this
; icon would have just failed silently. Switched to match the rest
; of the system.
click-left = i3-msg -q exec alacritty

[module/launcher-web]
type = custom/text
content = ""
content-foreground = #ff7f81
click-left = i3-msg -q exec firefox

[module/launcher-files]
type = custom/text
content = ""
content-foreground = #7f3fbf
click-left = i3-msg -q exec thunar ~/

[module/launcher-emoji]
type = custom/text
content = "😊"
content-foreground = ${colors.nord13}
click-left = rofi -show emoji -modi emoji -emoji-mode type

; ============================================================
; SYSTEM MONITORING — wired to your existing scripts
; ============================================================
[module/disk]
type = custom/script
exec = $HOME/.config/i3/scripts/disk
; NOTE: same caveat as before — confirm this script reads
; $BLOCK_INSTANCE or is hardcoded to "/"; polybar custom/script
; modules don't have an "instance=" concept at all, so if the
; script relied on i3blocks' instance field for the mount path,
; you'll need to hardcode it inside the script now.
label = 💾 %output%
interval = 30
label-foreground = ${colors.nord8}

[module/memory]
type = custom/script
exec = $HOME/.config/i3/scripts/memory
label = 🧠 %output%
interval = 2
label-foreground = ${colors.nord14}

[module/cpu]
type = custom/script
exec = $HOME/.config/i3/scripts/cpu_usage
label = 🖥️ %output%
interval = 2
label-foreground = #D08770

[module/temperature]
type = custom/script
exec = $HOME/.config/i3/scripts/temperature
label = 🌡️ %output%
interval = 30
label-foreground = ${colors.nord11}

; ============================================================
; NETWORK
; ============================================================
; FIX: the original referenced a non-existent scripts/network file.
; Replaced with inline nmcli command that shows active connection name.
[network]
type = custom/script
exec = nmcli -t -f NAME connection show --active 2>/dev/null | head -n1
label = 🌐 %output%
interval = 30
label-foreground = ${colors.nord9}

; ============================================================
; BANDWIDTH
; ============================================================

; ============================================================
; AUDIO
; ============================================================
[module/pulseaudio]
type = internal/pulseaudio
format-volume = 🎵 <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.nord13}
format-muted = 🔇 muted
click-right = pavucontrol
; Replaces both your old [pavucontrol] launcher block and [volume]
; reading block — polybar's native pulseaudio module scrolls to
; change volume and right-clicks to open pavucontrol directly.

; ============================================================
; POWER & BATTERY
; ============================================================

[module/battery]
type = custom/script
exec = $HOME/.config/i3/scripts/battery
label = 🔋 %output%
interval = 30
label-foreground = ${colors.nord8}
; If this shows the wrong symbol/color when charging or low, run
; the script directly in a terminal to check its raw stdout —
; same note as before, unchanged behavior from the script itself.

; ============================================================
; KEYBOARD & TIME
; ============================================================
[module/xkeyboard]
type = internal/xkeyboard
format = ⌨️ <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.nord9}

[module/date]
type = internal/date
interval = 1
date = %a %d %b %H:%M:%S
label = 🕐 %date%
label-foreground = ${colors.nord4}
; Same optional battery-drain tradeoff as before: 1-second interval
; wakes the bar every second for live seconds. Bump "interval" to
; 5 or drop %S from the date format if you'd rather save the wakeups.

[settings]
screenchange-reload = true
; pseudo-transparency fakes alpha by screenshotting what's behind the
; bar — only needed when no compositor is running. Since picom is
; active, false lets polybar use real ARGB transparency instead,
; which is what actually makes the background-only alpha in
; [colors] bg work correctly.
pseudo-transparency = false
